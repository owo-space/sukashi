services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sukashi:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET}
      PANEL_TITLE: ${PANEL_TITLE:-透かし}
      PANEL_DESCRIPTION: ${PANEL_DESCRIPTION:-自由への道}
      PANEL_VERSION: ${PANEL_VERSION:-1.7.6-sukad.2}
      PANEL_SERVER_TOKEN: ${PANEL_SERVER_TOKEN:-}
    ports:
      # Loopback only — fronted by host Nginx (TLS termination, real-IP, rate-limit).
      - "127.0.0.1:3000:3000"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sukashi}
      POSTGRES_USER: ${POSTGRES_USER:-sukashi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sukashi -d sukashi"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  redis_data:
