<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 透かし: a sakura petal arrangement on a deep indigo background.
       The five overlapping circles read as a five-petal cherry blossom
       at any size down to 16x16, with the golden pistil providing a
       focal point. Indigo + gold echoes a classic Japanese stamp. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f3a68"/>
      <stop offset="100%" stop-color="#0a1424"/>
    </linearGradient>
    <radialGradient id="petal" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8e6ee"/>
      <stop offset="100%" stop-color="#e7b6c8"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <g fill="url(#petal)">
    <circle cx="32" cy="18" r="9"/>
    <circle cx="17.5" cy="28" r="9"/>
    <circle cx="46.5" cy="28" r="9"/>
    <circle cx="23" cy="44" r="9"/>
    <circle cx="41" cy="44" r="9"/>
  </g>
  <circle cx="32" cy="32" r="4.5" fill="#f5b042"/>
  <circle cx="32" cy="32" r="2" fill="#fff8e1"/>
</svg>
